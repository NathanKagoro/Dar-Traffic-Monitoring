<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Preview card source</title>
<!-- Source for site/og.png. Rendered at 1200x630 by tools/og.mjs. Not published. -->
<link rel="stylesheet" href="../site/css/style.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  .card { position: relative; width: 1200px; height: 630px; }
  .card .gantry__truss { position: absolute; left: 0; right: 0; top: 38px; margin: 0; }
  .card .sign { position: absolute; left: 60px; top: 100px; width: 640px; padding: 34px 40px 36px; }
  .card h1 { font-size: 62px; line-height: 1.02; font-weight: 700; margin: 22px 0 18px; }
  .card .sign__route { font-size: 22px; }
  .card .shield { font-size: 20px; }
  .card .lede { font-size: 24px; line-height: 1.35; }
  .card .tag { position: absolute; left: 60px; bottom: 44px; }
  .card .tag span { font-size: 21px; }
  .card .map { position: absolute; right: 50px; top: 100px; width: 390px; border: 1px solid #2c3438; border-radius: 6px; overflow: hidden; background: var(--screen); }
  .card .map svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div class="card">
  <div class="gantry__truss"></div>
  <div class="sign">
    <p class="sign__route"><span class="shield">DSM</span> Concept briefing</p>
    <h1>Dar es Salaam Traffic Monitoring</h1>
    <p class="lede">52 monitoring points, one pipeline, and why the city's traffic is hard to measure.</p>
  </div>
  <p class="hazard tag"><span>The day on the map is simulated</span></p>
  <div class="map" id="map"></div>
</div>
<script type="module">
  import { POINTS } from '../site/js/points.js';
  import { CITY_BOUNDS, LAND, CORRIDORS, makeProjection } from '../site/js/geo.js';
  import { simulateDay, band } from '../site/js/sim.js';
  const NS = 'http://www.w3.org/2000/svg';
  const proj = makeProjection(CITY_BOUNDS, 390);
  const el = (n, a, p) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
  const d = (c, z) => c.map(([lon, lat], i) => (i ? 'L' : 'M') + proj.project(lon, lat).join(' ')).join('') + (z ? 'Z' : '');
  const svg = el('svg', { viewBox: '0 0 390 ' + proj.height }, document.getElementById('map'));
  el('path', { class: 'm-land', d: d(LAND, true) }, svg);
  for (const c of CORRIDORS) el('path', { class: 'm-road', d: d(c.line) }, svg);
  const day = simulateDay(POINTS);
  POINTS.forEach((p, i) => {
    const [x, y] = proj.project(p.lon, p.lat);
    const r = day.series[i][16];
    el('circle', { cx: x, cy: y, r: 4 + r * 4, class: 'band-' + band(r).key, stroke: '#0b0d0e', 'stroke-width': 1.4 }, svg);
  });
  document.body.dataset.ready = '1';
</script>
</body>
</html>
