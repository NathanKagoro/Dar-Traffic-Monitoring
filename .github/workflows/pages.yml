name: Pages

# Publishes the concept page in site/ to GitHub Pages. Only site/ is uploaded.
# Requires Settings -> Pages -> Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/last-keepalive'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build point data from the city config
        run: npm run build

      - name: Test before publishing
        run: npm test

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
