name: CI

# Tests the concept page and the collector's pure logic, and takes screenshots
# of the page. Uses no secrets and never touches the database or TomTom.

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check site/js/points.js matches the city config
        run: npm run check

      - name: Node tests (simulation, map geometry, point data)
        run: npm test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python tests (response parser, congestion ratio)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m pytest -v

      - name: Screenshots at 1440, 390 and 360 px
        run: |
          npm install --no-save puppeteer@23
          node tools/screenshots.mjs screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
